name: Lerna Publish Minor V1

on:
  # workflow_run:
  #   workflows: ["Codegen Main V1"]
  #   types:
  #     - completed

  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish Minor Versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v5
        with:
          submodules: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_PUBLISH_SECRET}}

      - name: Sync main
        run: git pull --ff-only origin main

      - name: Publish v1 Minor Version
        run: |
          cd v1
          yarn
          yarn lerna publish minor --force-publish=chain-registry --no-verify-access --yes --dist-tag legacy
          yarn lerna publish from-package --no-verify-access --yes --dist-tag legacy
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_PUBLISH_SECRET}}